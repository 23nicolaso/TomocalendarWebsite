<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tomocalendar — Support</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:wght@400;600;700&family=Manrope:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="site-header">
      <nav class="nav">
        <a class="brand" href="index.html">
          <span class="brand-mark">
            <img src="assets/logo.png" alt="Tomo Calendar logo" />
          </span>
          <span>Tomocalendar</span>
        </a>
        <div class="nav-links">
          <a href="index.html">Home</a>
          <a href="privacy.html">Privacy</a>
          <a href="support.html">Support</a>
        </div>
        <a class="cta" href="index.html#waitlist">Join waitlist</a>
      </nav>
    </header>

    <main class="form-wrap">
      <section class="form-card reveal">
        <h1>Support</h1>
        <p>
          Send us a note and your email app will open with everything ready to
          go.
        </p>
        <form id="support-form">
          <div>
            <label for="name">Name</label>
            <input id="name" name="name" type="text" autocomplete="name" required />
          </div>
          <div>
            <label for="email">Email</label>
            <input
              id="email"
              name="email"
              type="email"
              autocomplete="email"
              required
            />
          </div>
          <div>
            <label for="message">How can we help?</label>
            <textarea id="message" name="message" required></textarea>
          </div>
          <button class="cta" type="submit">Send message</button>
        </form>
        <noscript>
          <p>
            JavaScript is required to open your email client. You can also email
            us directly at <strong>origincosupport@gmail.com</strong>.
          </p>
        </noscript>
      </section>
    </main>

    <footer class="site-footer">
      <div class="footer-inner">
        <span>Tomocalendar © 2026</span>
        <div class="nav-links">
          <a href="privacy.html">Privacy policy</a>
          <a href="support.html">Support</a>
        </div>
      </div>
    </footer>

    <script src="scripts.js"></script>
  </body>
</html>
